<div style="text-align: center; margin-top: 50px; font-family: sans-serif;">
  <h1>Angular + Flask Full Stack</h1>
  
  <div style="padding: 20px; border: 2px solid #ccc; display: inline-block; border-radius: 10px; margin-top: 20px; background-color: #f9f9f9;">
    <h2>Backend Response:</h2>
    <p *ngIf="flaskData" style="color: green; font-weight: bold; font-size: 20px;">
      {{ flaskData.message }}
    </p>
    <p *ngIf="!flaskData" style="color: red;">
      Loading... (Make sure Flask is running!)
    </p>
  </div>
</div>
